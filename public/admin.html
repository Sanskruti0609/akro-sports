<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Akro Sports | Orders</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0a0a0b;color:#f4f3f0;font:15px/1.45 system-ui,sans-serif;padding:24px}
h1{font:900 34px/1 "Arial Narrow",Impact,sans-serif;font-style:italic;text-transform:uppercase;margin:0 0 4px}h1 span{color:#e10613}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
input,select,button{font:inherit;padding:10px 12px;background:#121215;color:#fff;border:1px solid #333;border-radius:0}
button{background:#e10613;border-color:#e10613;cursor:pointer;font-weight:700}
.msg{color:#ff6b73;min-height:22px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #2a2a30;vertical-align:top}
th{color:#9a9aa2;font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.pill{display:inline-block;padding:3px 8px;font-size:12px;border:1px solid #444}.paid{border-color:#2fb35a;color:#2fb35a}
small{color:#9a9aa2}.wrap{overflow-x:auto}
</style></head><body>
<h1>Akro <span>Orders</span></h1><small>Private page. Keep your admin key secret.</small>
<div class="bar"><input id="key" type="password" placeholder="Admin key" autocomplete="current-password"><button id="go">Load orders</button><button id="re" style="background:#222;border-color:#333">Refresh</button><span id="n"></span></div>
<div class="msg" id="msg"></div>
<div class="wrap"><table id="t" hidden><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Payment</th><th>Total</th><th>Status</th></tr></thead><tbody></tbody></table></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAT=['new','confirmed','packed','shipped','delivered','cancelled'];
let key=sessionStorage.getItem('akro_admin')||''; $('#key').value=key;
async function load(){
  key=$('#key').value; $('#msg').textContent='';
  const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':key}});
  if(!r.ok){$('#msg').textContent=(await r.json()).error||'Error';$('#t').hidden=true;return}
  sessionStorage.setItem('akro_admin',key);
  const o=await r.json(); $('#n').textContent=o.length+' orders'; $('#t').hidden=false;
  $('#t tbody').innerHTML=o.map(x=>`<tr><td><b>${esc(x.id)}</b><br><small>${new Date(x.created_at).toLocaleString('en-IN')}</small></td>
  <td>${esc(x.customer.name)}<br><small>${esc(x.customer.phone)}<br>${esc(x.customer.address)}, ${esc(x.customer.city)}, ${esc(x.customer.state)} ${esc(x.customer.pincode)}</small></td>
  <td>${x.items.map(i=>`${esc(i.name)} · ${esc(i.size)} × ${i.qty}${i.custom?` <small>(${esc([i.custom.name,i.custom.number].filter(Boolean).join(' '))})</small>`:''}`).join('<br>')}</td>
  <td><span class="pill ${x.payment_status==='paid'?'paid':''}">${esc(x.payment_method)}</span><br><small>${esc(x.payment_status)}</small></td>
  <td>₹${Number(x.total).toLocaleString('en-IN')}</td>
  <td><select data-id="${esc(x.id)}">${STAT.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('');
  document.querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{
    const r=await fetch('/api/admin/orders/'+s.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({status:s.value})});
    if(!r.ok)$('#msg').textContent='Could not update status';
  });
}
$('#go').onclick=load;$('#re').onclick=load;if(key)load();
</script></body></html>
